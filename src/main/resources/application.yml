spring:
  application:
    name: tao-ai-agent
  profiles:
    # 默认 local，部署时可用环境变量 SPRING_PROFILES_ACTIVE 覆盖
    active: ${SPRING_PROFILES_ACTIVE:local}
  ai:
    # 显式声明使用哪个 ChatModel / EmbeddingModel，避免多个同类型 Bean 造成注入歧义：
    # chat: deepseek   -> 只装配 DeepSeekChatModel（关闭 Ollama/DashScope 的 ChatModel 自动装配）
    # embedding: ollama -> 只装配 OllamaEmbeddingModel（本地 bge-m3）
    model:
      chat: deepseek
      embedding: ollama
server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.zt.taoaiagent.controller
# knife4j?
knife4j:
  enable: true
  setting:
    language: zh_cn




